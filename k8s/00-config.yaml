apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secrets
type: Opaque
stringData:
  POSTGRES_DB: task_tracker
  POSTGRES_USER: task_tracker
  POSTGRES_PASSWORD: task_tracker
  DATABASE_URL: postgres://task_tracker:task_tracker@postgres:5432/task_tracker?sslmode=disable

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-tracker-config
data:
  PORT: "8080"
  DB_MAX_CONNS: "10"
  SHUTDOWN_TIMEOUT: "10s"
  MIGRATE_ON_START: "false"